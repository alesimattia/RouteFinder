services:
  - type: web
    name: routefinder
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    # La versione di Python la fissa .python-version, che render legge anche per
    # un servizio non creato da Blueprint.
    envVars:
      # Segreti: si impostano dal pannello di render, mai nel repository.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: ROUTEFINDER_TOKEN
        sync: false
