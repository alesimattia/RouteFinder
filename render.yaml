services:
  - type: web
    name: routefinder
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Segreti: si impostano dal pannello di render, mai nel repository.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: ROUTEFINDER_TOKEN
        sync: false
